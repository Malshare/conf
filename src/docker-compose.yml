services:
  mysql:
    image: mysql:8.0.31
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    env_file:
      - frontend.env
    volumes:
      - /storage/malshare/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    image: ghcr.io/malshare/frontend
    expose:
      - "80"
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - daily_exports:/var/www/html/daily:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    depends_on:
      - frontend
    env_file:
      - frontend.env

  upload-handler:
    image: ghcr.io/malshare/upload-handler
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  url-task-handler:
    image: ghcr.io/malshare/url-task-handler
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  generate-daily:
    image: ghcr.io/malshare/generate-daily
    env_file:
      - frontend.env
    environment:
      - OUTPUT_DIR=/daily
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - daily_exports:/daily
    # Run once daily: execute script, sleep 24h, repeat
    entrypoint: ["/bin/sh", "-c", "while true; do python3 -u generate_daily.py; sleep 86400; done"]
    restart: unless-stopped

  cleanup-users:
    image: ghcr.io/malshare/cleanup-users
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    # Run once daily: execute script, sleep 24h, repeat
    entrypoint: ["/bin/sh", "-c", "while true; do python3 -u cleanup_users.py; sleep 86400; done"]
    restart: unless-stopped

  rollup-api-calls:
    image: ghcr.io/malshare/rollup-api-calls
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    # Run once daily: execute script, sleep 24h, repeat
    entrypoint: ["/bin/sh", "-c", "while true; do python3 -u rollup_api_calls.py; sleep 86400; done"]
    restart: unless-stopped

  refresh-stats:
    image: ghcr.io/malshare/refresh-stats
    env_file:
      - frontend.env
    depends_on:
      mysql:
        condition: service_healthy
    # Run once per hour: precompute expensive sample stats
    entrypoint: ["/bin/sh", "-c", "while true; do python3 -u refresh_stats.py; sleep 3600; done"]
    restart: unless-stopped

volumes:
  daily_exports:
